<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clash of Champions — RuangGuru x Skill Academy Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Caveat:wght@400;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-0: #FFFFFF;
      --bg-1: #F9FAFB;
      --card: #FFFFFF;
      --card-line: #E5E7EB;
      --gold: #E53935;
      --gold-dim: #FFEBEE;
      --ice: #E53935;
      --text-hi: #111827;
      --text-mid: #4B5563;
      --text-low: #9CA3AF;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background:
        radial-gradient(circle at 12% -10%, rgba(229, 57, 53, 0.06), transparent 45%),
        radial-gradient(circle at 88% 0%, rgba(229, 57, 53, 0.04), transparent 40%),
        var(--bg-0);
      color: var(--text-hi);
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .wrap {
      max-width: 1320px;
      margin: 0 auto;
      padding: 0 28px;
    }

    /* ---------- NAV ---------- */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 26px 0;
    }

    .brands {
      display: flex;
      align-items: center;
      gap: 14px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.02em;
    }

    .brands .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--text-low);
    }

    .brand-rg {
      color: var(--text-hi);
    }

    .brand-sa {
      color: var(--gold);
    }

    .nav-cta {
      border: 1px solid var(--card-line);
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-mid);
      transition: .2s;
    }

    .nav-cta:hover {
      border-color: var(--ice);
      color: var(--ice);
    }

    /* ---------- HERO ---------- */
    header.hero {
      padding: 64px 0 40px;
      text-align: center;
      position: relative;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.18em;
      color: var(--gold);
      border: 1px solid rgba(229, 57, 53, 0.25);
      background: rgba(229, 57, 53, 0.04);
      padding: 7px 16px;
      border-radius: 999px;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 8px rgba(229, 57, 53, 0.4);
    }

    h1.claim {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(30px, 5.4vw, 52px);
      line-height: 1.08;
      margin: 26px 0 14px;
      letter-spacing: -0.01em;
    }

    h1.claim .accent {
      color: var(--gold);
    }

    p.sub {
      max-width: 520px;
      margin: 0 auto;
      color: var(--text-mid);
      font-size: 16px;
      line-height: 1.6;
    }

    .titlecard {
      margin: 46px 0 8px;
      position: relative;
    }

    .titlecard .glowline {
      height: 1.5px;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      background: linear-gradient(90deg, transparent, var(--gold), #FFFFFF, var(--gold), transparent);
      opacity: 0.8;
    }

    .titlecard h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(38px, 8vw, 76px);
      letter-spacing: 0.01em;
      background: linear-gradient(180deg, #E53935 0%, #B71C1C 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin: 14px 0 6px;
      text-transform: uppercase;
    }

    .titlecard .tagline {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      letter-spacing: 0.14em;
      color: var(--text-low);
      text-transform: uppercase;
    }

    /* ---------- STAT STRIP ---------- */
    .statstrip {
      display: flex;
      justify-content: center;
      gap: 0;
      margin: 44px 0 8px;
      border-top: 1px solid var(--card-line);
      border-bottom: 1px solid var(--card-line);
    }

    .stat {
      flex: 1;
      max-width: 220px;
      text-align: center;
      padding: 20px 12px;
      border-left: 1px solid var(--card-line);
    }

    .stat:first-child {
      border-left: none;
    }

    .stat .num {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 26px;
      color: var(--gold);
    }

    .stat .lbl {
      font-size: 11.5px;
      color: var(--text-low);
      margin-top: 4px;
      letter-spacing: 0.04em;
    }

    /* ---------- ROSTER ---------- */
    section.roster {
      padding: 10px 0 40px;
    }

    .roster-head {
      text-align: center;
      margin-bottom: 46px;
    }

    .logo-img {
      max-height: 250px;
      height: auto;
      width: auto;
      max-width: 100%;
      margin: 0 auto 16px;
      display: block;
      opacity: 0.7;
    }

    .roster-head h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(22px, 3.4vw, 30px);
    }

    .roster-head p {
      font-family: 'Caveat', cursive;
      color: var(--text-mid);
      margin-top: 10px;
      font-size: 26px;
      font-weight: 500;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      column-gap: 16px;
      row-gap: 110px;
      margin-top: 80px;
    }

    .card {
      background: linear-gradient(180deg, var(--card) 0%, #F9FAFB 100%);
      border: 1px solid var(--card-line);
      border-radius: 18px;
      padding: 22px 18px 20px;
      position: relative;
      overflow: visible;
      transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .card::before {
      content: '';
      position: absolute;
      top: -40%;
      left: -20%;
      width: 160%;
      height: 160%;
      background: radial-gradient(circle at 30% 20%, rgba(229, 57, 53, 0.04), transparent 55%);
      pointer-events: none;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: var(--gold);
      box-shadow: 0 12px 30px rgba(229, 57, 53, 0.08);
    }

    .rank {
      position: absolute;
      top: 14px;
      right: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-low);
      letter-spacing: 0.1em;
    }

    .avatar {
      width: 176px;
      height: 176px;
      border-radius: 32px;
      display: block;
      margin: -88px auto 16px;
      border: 4px solid var(--card);
      box-shadow: 0 8px 24px rgba(229, 57, 53, 0.12);
      position: relative;
      z-index: 2;
      object-fit: cover;
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }
      50% {
        transform: translateY(-8px) rotate(1.5deg);
      }
    }

    .card:nth-child(1) .avatar {
      background: linear-gradient(135deg, #FF8A80, #E53935);
      color: #FFFFFF;
      animation: float 5s ease-in-out infinite;
    }

    .card:nth-child(2) .avatar {
      background: linear-gradient(135deg, #FF5252, #C62828);
      color: #FFFFFF;
      animation: float 5.8s ease-in-out infinite;
      animation-delay: -1s;
    }

    .card:nth-child(3) .avatar {
      background: linear-gradient(135deg, #FF1744, #B71C1C);
      color: #FFFFFF;
      animation: float 5.2s ease-in-out infinite;
      animation-delay: -2s;
    }

    .card:nth-child(4) .avatar {
      background: linear-gradient(135deg, #D50000, #880E4F);
      color: #FFFFFF;
      animation: float 6s ease-in-out infinite;
      animation-delay: -3s;
    }

    .card:nth-child(5) .avatar {
      background: linear-gradient(135deg, #FF8A80, #C62828);
      color: #FFFFFF;
      animation: float 5.5s ease-in-out infinite;
      animation-delay: -4s;
    }

    .card:nth-child(6) .avatar {
      background: linear-gradient(135deg, #E53935, #880E4F);
      color: #FFFFFF;
      animation: float 4.8s ease-in-out infinite;
      animation-delay: -5s;
    }

    .name {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 17px;
    }

    .major {
      font-size: 12.5px;
      color: var(--text-low);
      margin-top: 2px;
      margin-bottom: 14px;
    }

    .gpa-chip {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
      background: rgba(229, 57, 53, 0.05);
      border: 1px solid rgba(229, 57, 53, 0.2);
      color: var(--gold);
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 25px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .gpa-chip span {
      color: var(--text-low);
      font-weight: 500;
      font-size: 16px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }

    .tag {
      font-size: 22px;
      color: var(--text-mid);
      border: 1px solid var(--card-line);
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(229, 57, 53, 0.03);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .tag:empty {
      display: none;
    }

    /* ---------- CTA ---------- */
    section.cta {
      margin: 70px 0 90px;
      text-align: center;
      padding: 56px 28px;
      border-radius: 24px;
      background:
        radial-gradient(circle at 20% 0%, rgba(229, 57, 53, 0.06), transparent 55%),
        radial-gradient(circle at 85% 100%, rgba(229, 57, 53, 0.04), transparent 50%),
        var(--bg-1);
      border: 1px solid var(--card-line);
      position: relative;
    }

    .cta h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(24px, 4vw, 36px);
      margin-bottom: 12px;
    }

    .cta p {
      color: var(--text-mid);
      max-width: 440px;
      margin: 0 auto 28px;
      font-size: 15px;
      line-height: 1.6;
    }

    .cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--gold);
      color: #FFFFFF;
      font-weight: 700;
      font-size: 14.5px;
      padding: 14px 30px;
      border-radius: 999px;
      transition: .2s;
    }

    .cta-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(229, 57, 53, 0.25);
    }

    footer {
      text-align: center;
      padding: 30px 0 50px;
      color: var(--text-low);
      font-size: 12.5px;
      border-top: 1px solid var(--card-line);
    }

    footer .brands {
      justify-content: center;
      margin-bottom: 8px;
    }

    @media (max-width: 1200px) {
      .grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 860px) {
      .statstrip {
        flex-wrap: wrap;
      }

      .stat {
        flex: 1 1 40%;
        max-width: none;
      }
    }

    @media (max-width: 680px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 480px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .wrap {
        padding: 0 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }

    /* ---------- MUSIC CONTROLLER ---------- */
    .music-toggle-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--card-line);
      box-shadow: 0 4px 20px rgba(229, 57, 53, 0.08);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      z-index: 100;
      transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
    }

    .music-toggle-btn:hover {
      transform: scale(1.08);
      background: #FFFFFF;
      box-shadow: 0 6px 24px rgba(229, 57, 53, 0.15);
    }

    .music-toggle-btn:active {
      transform: scale(0.95);
    }

    .music-toggle-btn.playing {
      background: var(--gold-dim);
      border-color: rgba(229, 57, 53, 0.3);
      animation: pulse-music 2.5s infinite;
    }

    @keyframes pulse-music {
      0% {
        box-shadow: 0 0 0 0 rgba(229, 57, 53, 0.3);
      }
      70% {
        box-shadow: 0 0 0 10px rgba(229, 57, 53, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(229, 57, 53, 0);
      }
    }
  </style>
</head>

<body>
  <section class="roster">
    <div class="wrap">
      <div class="roster-head">
        <img src="logo.png" alt="JeSica Champions Logo" class="logo-img">
        <p>Republic of Indonesia Independence Day Commemoration Competitions by Telkomsigma</p>
      </div>
      <div class="titlecard">
        <div class="glowline"></div>
      </div>

      <div class="grid">
        <div class="card" data-team="ikn">
          <img src="ikn.png" class="avatar" alt="IKN">
          <div class="name">TIM IKN</div>
          <div class="gpa-chip"><span class="points-num">0</span><span>poin</span></div>
          <div class="tags">
            <span class="tag"></span>
          </div>
        </div>

        <div class="card" data-team="asn">
          <img src="asn.png" class="avatar" alt="ASN">
          <div class="name">TIM ASN</div>
          <div class="gpa-chip"><span class="points-num">0</span><span>poin</span></div>
          <div class="tags">
            <span class="tag"></span>
          </div>
        </div>

        <div class="card" data-team="mbg">
          <img src="mbg.png" class="avatar" alt="MBG">
          <div class="name">TIM MBG</div>
          <div class="gpa-chip"><span class="points-num">0</span><span>poin</span></div>
          <div class="tags">
            <span class="tag"></span>
          </div>
        </div>

        <div class="card" data-team="bbm">
          <img src="bbm.png" class="avatar" alt="BBM">
          <div class="name">TIM BBM</div>
          <div class="gpa-chip"><span class="points-num">0</span><span>poin</span></div>
          <div class="tags">
            <span class="tag"></span>
          </div>
        </div>

        <div class="card" data-team="kdmp">
          <img src="kdmp.png" class="avatar" alt="KDMP">
          <div class="name">TIM KDMP</div>
          <div class="gpa-chip"><span class="points-num">0</span><span>poin</span></div>
          <div class="tags">
            <span class="tag"></span>
          </div>
        </div>

        <div class="card" data-team="idr">
          <img src="idr.png" class="avatar" alt="IDR">
          <div class="name">TIM IDR</div>
          <div class="gpa-chip"><span class="points-num">0</span><span>poin</span></div>
          <div class="tags">
            <span class="tag"></span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Background Music Audio and Button Toggle -->
  <audio id="bgMusic" src="backsound.mp3" loop autoplay></audio>
  <button id="musicToggle" class="music-toggle-btn playing" aria-label="Toggle Music">
    <span class="music-icon">🔊</span>
  </button>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Helper function to parse CSV lines
      function parseCSV(text) {
        const lines = text.trim().split("\n");
        const headers = lines[0].split(",");
        const data = [];
        for (let i = 1; i < lines.length; i++) {
          const cols = lines[i].split(",");
          if (cols.length === headers.length) {
            const row = {};
            headers.forEach((header, index) => {
              row[header.trim().toLowerCase()] = cols[index].trim();
            });
            data.push(row);
          }
        }
        return data;
      }

      // Update UI function
      function updateUI(teamsData) {
        teamsData.forEach(row => {
          const teamName = row.tim.toLowerCase();
          const kemenangan = parseInt(row.kemenangan, 10) || 0;
          const points = kemenangan * 10;

          // Find card corresponding to team
          const card = document.querySelector(`.card[data-team="${teamName}"]`);
          if (card) {
            // Update points text
            const pointsEl = card.querySelector(".points-num");
            if (pointsEl) {
              pointsEl.textContent = points;
            }

            // Update medal icons (🥇 repeated by kemenangan value)
            const tagEl = card.querySelector(".tag");
            if (tagEl) {
              if (kemenangan > 0) {
                tagEl.textContent = "🥇".repeat(kemenangan);
              } else {
                tagEl.textContent = "";
              }
            }
          }
        });
      }

      // Function to fetch and update data
      function fetchAndPopulate() {
        // Append a cache-busting timestamp query parameter to prevent browser caching of the CSV file
        fetch("master-tim.csv?t=" + new Date().getTime())
          .then(response => {
            if (!response.ok) {
              throw new Error("Failed to load CSV: " + response.statusText);
            }
            return response.text();
          })
          .then(csvText => {
            const parsedData = parseCSV(csvText);
            updateUI(parsedData);
          })
          .catch(err => {
            console.warn("Dynamic CSV fetch disabled or blocked (normal on file:// protocols).", err);
            // Set initial points and medals for file:// fallback based on CSV file contents
            const fallbackData = [
              { tim: "ikn", kemenangan: "0" },
              { tim: "asn", kemenangan: "0" },
              { tim: "mbg", kemenangan: "0" },
              { tim: "bbm", kemenangan: "0" },
              { tim: "kdmp", kemenangan: "0" },
              { tim: "idr", kemenangan: "0" }
            ];
            updateUI(fallbackData);
          });
      }

      // Background Music Controller Logic
      const music = document.getElementById("bgMusic");
      const musicToggle = document.getElementById("musicToggle");
      const musicIcon = musicToggle.querySelector(".music-icon");

      // Set default volume to 30%
      music.volume = 0.3;

      function playMusic() {
        music.play()
          .then(() => {
            musicToggle.classList.add("playing");
            musicIcon.textContent = "🔊";
          })
          .catch(err => {
            console.log("Autoplay blocked by browser policy. Waiting for user interaction.", err);
          });
      }

      // Try playing immediately on startup
      playMusic();

      function pauseMusic() {
        music.pause();
        musicToggle.classList.remove("playing");
        musicIcon.textContent = "🔇";
      }

      musicToggle.addEventListener("click", (e) => {
        e.stopPropagation();
        if (music.paused) {
          playMusic();
        } else {
          pauseMusic();
        }
      });

      // Auto-play on first click anywhere on the page (handles browser policies)
      document.addEventListener("click", () => {
        if (music.paused && !musicToggle.classList.contains("user-paused")) {
          playMusic();
        }
      }, { once: true });

      // Track if user explicitly paused it
      musicToggle.addEventListener("click", () => {
        if (music.paused) {
          musicToggle.classList.add("user-paused");
        } else {
          musicToggle.classList.remove("user-paused");
        }
      });

      // Initial execution on DOM load
      fetchAndPopulate();

      // Automatically refresh every 15 seconds (15000 milliseconds)
      setInterval(fetchAndPopulate, 15000);
    });
  </script>

</body>

</html>
